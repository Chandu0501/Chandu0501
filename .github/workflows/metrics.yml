name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip until METRICS_TOKEN is set
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::Add a METRICS_TOKEN repository secret to generate github-metrics.svg"

      # Commits github-metrics.svg to this repo; that push re-runs Update README,
      # which then adds the image to the README.
      - uses: lowlighter/metrics@latest
        if: env.METRICS_TOKEN != ''
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
